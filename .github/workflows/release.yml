name: Build, Test and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ">=1.20"
          cache: true

      - name: Run tests
        run: make test

      - name: Generate code coverage
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.txt
          fail_ci_if_error: false

  release:
    name: Release
    needs: test
    if: success() && (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.24"
          cache: true

      # Get current date for release notes
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      # For tagged releases - use normal release process
      - name: Release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # For main branch - use a temporary "v0.0.0-dev" tag for building
      - name: Create temporary dev tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git tag -f v0.0.0-dev

      # Build using the temporary dev tag with updated skip syntax
      - name: Build for main branch
        if: github.ref == 'refs/heads/main'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip publish,validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Delete existing latest release if it exists
      - name: Delete existing latest release
        if: github.ref == 'refs/heads/main'
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/latest" | \
            jq -r '.id // empty')

          if [ ! -z "$RELEASE_ID" ]; then
            echo "Deleting existing release with ID: $RELEASE_ID"
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID"
          else
            echo "No existing release found with tag 'latest'"
          fi
        continue-on-error: true

      # Delete latest tag if it exists
      - name: Delete latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git push --delete origin latest || true
        continue-on-error: true

      # Create latest tag pointing to the current commit
      - name: Create latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git tag -f latest
          git push -f origin latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create a new latest release using the latest tag
      - name: Create Latest Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Development build (Latest)
          body: |
            This is the latest development build from the `main` branch.

            **Commit:** ${{ github.sha }}
            **Built on:** ${{ steps.date.outputs.date }}

            ⚠️ This is a pre-release build and may contain bugs or incomplete features.
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Clean up temporary tag
      - name: Clean up temporary dev tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -d v0.0.0-dev || true
        continue-on-error: true
