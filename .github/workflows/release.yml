name: Build, Test and Release

# Trigger workflow on push to main, tag push, or PR to main
on:
  push:
    branches:
      - main
    tags:
      - "v*" # Any tag starting with 'v'
  pull_request:
    branches:
      - main

jobs:
  # Test job: run tests and generate coverage
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history for tags and branches

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ">=1.20"
          cache: true # Cache Go modules

      - name: Run tests
        run: make test

      - name: Generate code coverage
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.txt
          fail_ci_if_error: false # Don't fail if upload to Codecov fails

  # Release job: build and publish releases
  release:
    name: Release
    needs: test # Only run after tests pass
    # Only run on push to main or tag push
    if: success() && (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history for tags and branches

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.24"
          cache: true

      # For main branch pushes, create or update a 'latest' tag
      # This ensures the release is associated with the 'latest' tag
      - name: Create/update latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git tag -f latest  # Force update the latest tag
          git push -f origin latest  # Force push the latest tag

      # Run GoReleaser to build and publish the release
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
