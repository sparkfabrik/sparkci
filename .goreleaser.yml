# .goreleaser.yaml - Configuration for both stable and development releases
version: 2

project_name: sparkci

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/sparkci
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
      - -X main.builtBy=goreleaser

archives:
  - format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ if or .IsSnapshot (not .IsTag) }}
      {{- .ProjectName }}_
      {{- .ShortCommit }}_
      {{- .Os }}_
      {{- .Arch }}
      {{ else }}
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  use_custom_tag: true

release:
  github:
    owner: sparkfabrik
    name: sparkci
  prerelease: "{{ or .IsSnapshot (not .IsTag) }}"
  name_template: >-
    {{ if .IsTag }}
    Release {{ .Tag }}
    {{ else }}
    Development build (Latest)
    {{ end }}
  mode: "{{ if .IsTag }}append{{ else }}replace{{ end }}"
  tag_name: "{{ if .IsTag }}{{ .Tag }}{{ else }}latest{{ end }}"
  disable: false
