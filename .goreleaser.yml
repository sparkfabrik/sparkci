name: Build, Test and Release

# Trigger workflow on push to main, tag push, or PR to main
on:
  push:
    branches:
      - main
    tags:
      - "v*" # Any tag starting with 'v'
  pull_request:
    branches:
      - main

jobs:
  # Test job: run tests and generate coverage
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history for tags and branches

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ">=1.20"
          cache: true # Cache Go modules

      - name: Run tests
        run: make test

      - name: Generate code coverage
        run: go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.txt
          fail_ci_if_error: false # Don't fail if upload to Codecov fails

  # Release job: build and publish releases
  release:
    name: Release
    needs: test # Only run after tests pass
    # Only run on push to main or tag push
    if: success() && (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history for tags and branches

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.24"
          cache: true

      # For tag pushes, do a normal release
      # For main branch pushes, use snapshot mode and manually upload to GitHub Release
      - name: Build with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ startsWith(github.ref, 'refs/tags/v') && 'release --clean' || 'build --snapshot' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only for main branch - Create or update the "latest" release
      - name: Update Latest Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Development build (Latest)
          body: |
            This is the latest development build from the `main` branch.

            **Commit:** ${{ github.sha }}
            **Built on:** $(date +'%Y-%m-%d %H:%M:%S')

            ⚠️ This is a pre-release build and may contain bugs or incomplete features.
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
